<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#10b981" />
    <meta name="msapplication-TileColor" content="#10b981" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Primary SEO -->
    <title>LearnChain — Developer Career Roadmaps for India</title>
    <meta name="description" content="Step-by-step developer roadmaps, real salary data, and curated resources for software engineering careers in India. Explore paths for Java, Node.js, React, DevOps, AI/ML, and more." />
    <meta name="keywords" content="developer roadmap india, software engineer career path, sde roadmap, java backend roadmap, devops roadmap, react roadmap, ai ml roadmap, fresher salary india, learnchain" />
    <meta name="author" content="LearnChain.in" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://learnchain.in/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LearnChain" />
    <meta property="og:title" content="LearnChain — Developer Career Roadmaps for India" />
    <meta property="og:description" content="Step-by-step developer roadmaps, real salary data (₹ LPA), and curated learning resources for software engineering careers in India." />
    <meta property="og:url" content="https://learnchain.in/" />
    <meta property="og:image" content="https://learnchain.in/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="LearnChain — Developer Career Roadmaps for India" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@learnchain_in" />
    <meta name="twitter:title" content="LearnChain — Developer Career Roadmaps for India" />
    <meta name="twitter:description" content="Step-by-step developer roadmaps with real salary data for Indian software engineers." />
    <meta name="twitter:image" content="https://learnchain.in/og-cover.png" />
    <meta name="twitter:image:alt" content="LearnChain — Developer Career Roadmaps for India" />

    <!-- JSON-LD: WebSite + SearchAction + Organization + ItemList -->
    <script type="application/ld+json">

      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://learnchain.in/#website",
          "url": "https://learnchain.in/",
          "name": "LearnChain",
          "description": "Structured developer career roadmaps and real salary data for software engineers in India.",
          "inLanguage": "en-IN",
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://learnchain.in/?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://learnchain.in/#organization",
          "name": "LearnChain",
          "url": "https://learnchain.in/",

            "url": "https://learnchain.in/logo.png",
            "width": 192,
            "height": 192
          },
          "sameAs": []
        },
        {
          "@type": "ItemList",
          "@id": "https://learnchain.in/#roadmap-list",
          "name": "Developer Career Roadmaps",
          "description": "Curated step-by-step learning roadmaps for software engineering roles in India",
          "numberOfItems": 20,
          "itemListElement": [

            { "@type": "ListItem", "position": 14, "name": "Java Backend Engineer Roadmap",               "url": "https://learnchain.in/roadmap/backend-java" },
            { "@type": "ListItem", "position": 15, "name": "Node.js Backend Engineer Roadmap",            "url": "https://learnchain.in/roadmap/backend-nodejs" },
            { "@type": "ListItem", "position": 16, "name": "React Frontend Engineer Roadmap",             "url": "https://learnchain.in/roadmap/frontend-react" },
            { "@type": "ListItem", "position": 17, "name": "DevOps & AWS Engineer Roadmap",               "url": "https://learnchain.in/roadmap/devops-aws" },
            { "@type": "ListItem", "position": 18, "name": "Data Engineering Roadmap",                    "url": "https://learnchain.in/roadmap/specialized-data-engineering" },
            { "@type": "ListItem", "position": 19, "name": "Mobile Development Roadmap",                  "url": "https://learnchain.in/roadmap/specialized-mobile" },
            { "@type": "ListItem", "position": 20, "name": "AI / ML Engineer Roadmap",                    "url": "https://learnchain.in/roadmap/ai-ml" }
          ]
        }
      ]
    }

    <!-- Font preconnects — must come before font stylesheets -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="dns-prefetch" href="https://api.fontshare.com" />

    <!-- Fonts: Inter (UI) + Cabinet Grotesk (headings) + General Sans (body) -->
