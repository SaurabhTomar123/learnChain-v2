<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LearnChain Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #111827;
        background: #f9fafb;
      }
      main {
        width: min(90vw, 420px);
        padding: 32px;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        background: white;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { margin: 0; color: #4b5563; line-height: 1.6; }
      a { display: inline-block; margin-top: 20px; color: #1a7f4b; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>LearnChain could not reach the network. Reconnect and refresh to continue your roadmap.</p>
      <a href="/">Try home</a>
    </main>
  </body>
</html>
